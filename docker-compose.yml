services:
  mosquitto:
    image: eclipse-mosquitto:latest
    container_name: coolwatch-mqtt
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log
    restart: unless-stopped

  app:
    build: ./app
    container_name: coolwatch-app
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./app:/app
      - ./data:/data
    environment:
      - MQTT_HOST=mosquitto
      - MQTT_PORT=1883
      - DB_PATH=/data/coolwatch.db
      - RUN_SIMULATOR=${RUN_SIMULATOR:-true}   # set false when Pi is the publisher
      - CV_STREAM_URL=${CV_STREAM_URL:-http://host.docker.internal:8001/stream}
    depends_on:
      - mosquitto
    restart: unless-stopped

  cv:
    build: ./cv
    container_name: coolwatch-cv
    volumes:
      - ./data:/data        # rois.json lives here
    environment:
      - MQTT_HOST=mosquitto
      - MQTT_PORT=1883
      - CAMERA_URL=${CAMERA_URL:-http://192.168.179.18:8080/video}
      - FACE_BLUR=${FACE_BLUR:-true}
      - INFER_W=${INFER_W:-640}
      - INFER_H=${INFER_H:-360}
      - STREAM_W=${STREAM_W:-640}
      - STREAM_H=${STREAM_H:-360}
      - HAAR_MIN_NEIGHBORS=${HAAR_MIN_NEIGHBORS:-4}
      - HAAR_MIN_SIZE=${HAAR_MIN_SIZE:-24}
      - SMOOTH_WINDOW=${SMOOTH_WINDOW:-3}
      - ROOM=sendai_lab
      - ROIS_FILE=/data/rois.json
      - DIFF_THRESHOLD=0.05
      - INTERVAL=2.0
      - STREAM_PORT=8001
    ports:
      - "8001:8001"
    depends_on:
      - mosquitto
